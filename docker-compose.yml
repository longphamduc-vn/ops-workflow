services:
  ops-workflow:
    build:
      context: ./services/ops-workflow
      dockerfile: Dockerfile
    container_name: opsflow-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///opsflow.db
      - WORKFLOWS_DIR=workflows
      - LOG_LEVEL=INFO
    volumes:
      - ./services/ops-workflow/workflows:/app/workflows
      - ./services/ops-workflow/config:/app/config
      - opsflow-data:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  ems-simulation:
    build:
      context: ./services/ems-simulation
      dockerfile: Dockerfile
    container_name: ems-simulator
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - EMS_SIM_HOST=0.0.0.0
      - EMS_SIM_PORT=9000
      - EMS_SIM_DATABASE_URL=sqlite+aiosqlite:///ems_simulation.db
      - EMS_SIM_LOG_LEVEL=INFO
    volumes:
      - ./services/ems-simulation/catalog:/app/catalog
      - ems-sim-data:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  opsflow-data:
  ems-sim-data:
