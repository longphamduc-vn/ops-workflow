<!DOCTYPE html>

<head>

<title>Procurement Workflow – UML Activity Diagram</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1120;color:#e2e8f0;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;background:#0f172a;border-bottom:1px solid #1e3a5f;flex-shrink:0;z-index:30}
header h1{font-size:14px;font-weight:700;color:#93c5fd;letter-spacing:.4px;white-space:nowrap;display:flex;align-items:center;gap:8px}
header span{font-size:11px;color:#94a3b8;flex:1}
.header-actions{display:flex;align-items:center;gap:8px}
.btn{padding:5px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:#334155;color:#e2e8f0;border-color:#475569}
.btn-primary{background:#1d4ed8;color:#fff;border-color:#2563eb}
.btn-primary:hover{background:#2563eb;color:#fff}
.badge-legend{display:flex;align-items:center;gap:12px;padding-right:8px;font-size:11px}
.legend-item{display:flex;align-items:center;gap:5px;color:#94a3b8}
.legend-dot{width:8px;height:8px;border-radius:50%}

#vp{flex:1;overflow:hidden;position:relative;cursor:grab}
#vp.panning{cursor:grabbing}
#diag{display:block;transform-origin:0 0}

/* Detail Panel */
#dp{position:fixed;top:56px;right:0;width:420px;height:calc(100vh - 56px);background:#0f172a;border-left:1px solid #1e3a5f;transform:translateX(100%);transition:transform .25s cubic-bezier(0.16,1,0.3,1);z-index:50;overflow-y:auto;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,0.45)}
#dp.open{transform:translateX(0)}
#dp-head{padding:14px 18px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;background:#131d35}
#dp-code{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;background:#1e293b;letter-spacing:.5px}
#dp-title{font-size:13px;font-weight:600;color:#f8fafc;flex:1;line-height:1.4}
#dp-close{background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;padding:0 6px;line-height:1;border-radius:4px}
#dp-close:hover{color:#e2e8f0;background:#1e293b}
#dp-body{padding:16px 18px;flex:1}
.dp-sec{margin-bottom:16px}
.dp-sec h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#64748b;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.raci-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.raci-cell{background:#1e293b;border-radius:5px;padding:6px 10px;font-size:11px;border:1px solid #283548}
.raci-cell b{color:#93c5fd;display:block;font-size:9px;margin-bottom:2px;letter-spacing:.5px}
.dp-list{list-style:none;padding:0}
.dp-list li{font-size:11px;color:#cbd5e1;padding:4px 0 4px 14px;border-bottom:1px solid #1e293b40;position:relative;line-height:1.45}
.dp-list li::before{content:'›';position:absolute;left:0;color:#60a5fa;font-weight:700}
.lane-badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;display:inline-block}

/* SVG node styles */
.n{cursor:pointer;transition:transform .15s}
.n:hover rect,.n:hover polygon{filter:brightness(1.22);stroke-width:2.2px}
.n:hover circle{filter:brightness(1.25)}
.n.active rect,.n.active polygon{stroke:#38bdf8 !important;stroke-width:2.5px !important;filter:drop-shadow(0 0 8px rgba(56,189,248,0.5))}
</style>
</head>

    title: 'Procurement Lifecycle Completed',
    lane: 'All Actors',
    raci: { R: 'Procurement', A: 'Management', C: 'Finance', I: 'Requestor' },
    inputs: [
      'Fulfilled procurement order (Tier 1, Tier 2, or Tier 3)'
    ],
    rules: [
      'All documentation preserved in compliant 5-year digital audit archive',
      'Consolidated monthly procurement intelligence reporting',
      'KPI evaluation: Lead time, cost variance, and interlock resolution rate'
    ],
    outputs: [
      'Closed procurement lifecycle record',
      'Traceable audit trail',
      'Monthly procurement operations summary report'
    ]
  }
};

// ═══════════════════════════════════════════════
//  Detail Panel Logic
// ═══════════════════════════════════════════════
let activeNodeId = null;

function show(id) {
  const d = D[id];
  if (!d) return;

  // Clear previous active highlights
  document.querySelectorAll('.n.active').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById('node-' + id);
  if (activeEl) activeEl.classList.add('active');
  activeNodeId = id;

  document.getElementById('dp-code').textContent = d.code;
  document.getElementById('dp-code').style.color = d.color;
  document.getElementById('dp-title').textContent = d.title;
  
  const lb = document.getElementById('dp-lane-badge');
  lb.textContent = d.lane;
  lb.style.background = d.color + '26';
  lb.style.color = d.color;
  lb.style.border = '1px solid ' + d.color + '55';

  const raci = document.getElementById('dp-raci');
  raci.innerHTML = ['R','A','C','I'].map(k => {
    const full = k === 'R' ? 'Responsible' : k === 'A' ? 'Accountable' : k === 'C' ? 'Consulted' : 'Informed';
    return `<div class="raci-cell"><b>${k} – ${full}</b>${d.raci[k] || '—'}</div>`;
  }).join('');

  ['inputs', 'rules', 'outputs'].forEach(key => {
    const el = document.getElementById('dp-' + key);
    el.innerHTML = (d[key] || []).map(s => `<li>${s}</li>`).join('');
  });

  document.getElementById('dp').classList.add('open');
}

function closePanel() {
  document.getElementById('dp').classList.remove('open');
  if (activeNodeId) {
    const el = document.getElementById('node-' + activeNodeId);
    if (el) el.classList.remove('active');
    activeNodeId = null;
  }
}

// ═══════════════════════════════════════════════
//  Pan & Zoom Controls
// ═══════════════════════════════════════════════
let scale = 0.52, tx = 10, ty = 10;
const svg = document.getElementById('diag');
const vp  = document.getElementById('vp');

function applyTransform() {
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
applyTransform();

function fitView() {
  const vpw = vp.clientWidth;
  const vph = vp.clientHeight;
  const dw = 2100;
  const dh = 2300;
  scale = Math.min((vpw - 40) / dw, (vph - 40) / dh);
  scale = Math.max(0.2, Math.min(1.2, scale));
  tx = Math.max(10, (vpw - dw * scale) / 2);
  ty = 20;
  applyTransform();
}

function zoom(factor) {
  const cx = vp.clientWidth / 2;
  const cy = vp.clientHeight / 2;
  tx = cx - (cx - tx) * factor;
  ty = cy - (cy - ty) * factor;
  scale *= factor;
  scale = Math.max(0.1, Math.min(5, scale));
  applyTransform();
}

// Wheel zoom
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = vp.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale *= factor;
  scale = Math.max(0.08, Math.min(6, scale));
  applyTransform();
}, { passive: false });

// Pan interactions
let dragging = false, startX, startY, startTx, startTy;
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.n') || e.target.closest('#dp')) return;
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  startTx = tx; startTy = ty;
  vp.classList.add('panning');
});

window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = startTx + (e.clientX - startX);
  ty = startTy + (e.clientY - startY);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  dragging = false;
  vp.classList.remove('panning');
});

// Close panel when clicking empty diagram canvas
vp.addEventListener('click', e => {
  if (!e.target.closest('.n') && !e.target.closest('#dp')) {
    closePanel();
  }
});

// Initial fit on page load
window.addEventListener('DOMContentLoaded', fitView);
window.addEventListener('resize', fitView);
</script>
