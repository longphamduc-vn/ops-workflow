<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1120;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;background:#0f172a;border-bottom:1px solid #1e3a5f;flex-shrink:0;z-index:30}
header h1{font-size:14px;font-weight:700;color:#93c5fd;letter-spacing:.4px;white-space:nowrap}
header span{font-size:11px;color:#64748b;flex:1}
.btn{padding:5px 12px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:11px;cursor:pointer;transition:background .15s}
.btn:hover{background:#334155;color:#e2e8f0}
#vp{flex:1;overflow:hidden;position:relative;cursor:grab}
#vp.panning{cursor:grabbing}
#diag{display:block;transform-origin:0 0}
/* detail panel */
#dp{position:fixed;top:56px;right:0;width:400px;height:calc(100vh - 56px);background:#0f172a;border-left:1px solid #1e3a5f;transform:translateX(100%);transition:transform .25s ease;z-index:50;overflow-y:auto;display:flex;flex-direction:column}
#dp.open{transform:translateX(0)}
#dp-head{padding:14px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
#dp-code{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;background:#1e293b}
#dp-title{font-size:13px;font-weight:600;color:#e2e8f0;flex:1}
#dp-close{background:none;border:none;color:#64748b;font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
#dp-close:hover{color:#e2e8f0}
#dp-body{padding:14px 16px;flex:1}
.dp-sec{margin-bottom:14px}
.dp-sec h3{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#64748b;margin-bottom:6px}
.raci-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.raci-cell{background:#1e293b;border-radius:4px;padding:5px 8px;font-size:11px}
.raci-cell b{color:#93c5fd;display:block;font-size:9px;margin-bottom:1px}
.dp-list{list-style:none;padding:0}
.dp-list li{font-size:11px;color:#cbd5e1;padding:3px 0 3px 12px;border-bottom:1px solid #1e293b30;position:relative}
.dp-list li::before{content:'›';position:absolute;left:0;color:#475569}
.lane-badge{font-size:10px;padding:2px 7px;border-radius:3px;color:#fff}
/* SVG node styles via CSS */
.n{cursor:pointer}
.n:hover rect,.n:hover polygon{filter:brightness(1.18)}
</style>
</head>

// ═══════════════════════════════════════════════
//  Detail panel logic
// ═══════════════════════════════════════════════
function show(id) {
  const d = D[id];
  if (!d) return;
  document.getElementById('dp-code').textContent = d.code;
  document.getElementById('dp-code').style.color = d.color;
  document.getElementById('dp-title').textContent = d.title;
  const lb = document.getElementById('dp-lane-badge');
  lb.textContent = d.lane;
  lb.style.background = d.color + '33';
  lb.style.color = d.color;
  lb.style.border = '1px solid ' + d.color + '55';

  const raci = document.getElementById('dp-raci');
  raci.innerHTML = ['R','A','C','I'].map(k =>
    `<div class="raci-cell"><b>${k} – ${k==='R'?'Responsible':k==='A'?'Accountable':k==='C'?'Consulted':'Informed'}</b>${d.raci[k]||'—'}</div>`
  ).join('');

  ['inputs','rules','outputs'].forEach(key => {
    const el = document.getElementById('dp-'+key);
    el.innerHTML = (d[key]||[]).map(s=>`<li>${s}</li>`).join('');
  });
  document.getElementById('dp').classList.add('open');
}

function closePanel() {
  document.getElementById('dp').classList.remove('open');
}

// ═══════════════════════════════════════════════
//  Pan & Zoom
// ═══════════════════════════════════════════════
let scale = 0.52, tx = 10, ty = 10;
const svg = document.getElementById('diag');
const vp  = document.getElementById('vp');

function applyTransform() {
  svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
applyTransform();

function fitView() {
  scale = 0.52; tx = 10; ty = 10;
  applyTransform();
}

function zoom(factor) {
  const cx = vp.clientWidth / 2;
  const cy = vp.clientHeight / 2;
  tx = cx - (cx - tx) * factor;
  ty = cy - (cy - ty) * factor;
  scale *= factor;
  scale = Math.max(0.1, Math.min(5, scale));
  applyTransform();
}

// Wheel zoom
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.1 : 0.9;
  const rect = vp.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * factor;
  ty = my - (my - ty) * factor;
  scale *= factor;
  scale = Math.max(0.08, Math.min(6, scale));
  applyTransform();
}, {passive: false});

// Pan
let dragging = false, startX, startY, startTx, startTy;
vp.addEventListener('mousedown', e => {
  if (e.target.closest('.n') || e.target.closest('#dp')) return;
  dragging = true;
  startX = e.clientX; startY = e.clientY;
  startTx = tx; startTy = ty;
  vp.classList.add('panning');
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  tx = startTx + (e.clientX - startX);
  ty = startTy + (e.clientY - startY);
  applyTransform();
});
window.addEventListener('mouseup', () => {
  dragging = false;
  vp.classList.remove('panning');
});

// Close panel on background click
vp.addEventListener('click', e => {
  if (!e.target.closest('.n')) closePanel();
});
