[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opsflow"
version = "0.1.0"
description = "Generic workflow engine for operational automations and legacy EMS integration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ops Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "jmespath>=1.0.1",
    "simpleeval>=0.9.13",
    "jsonschema>=4.22.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.21.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "types-jmespath",
    "types-jsonschema",
]

[project.scripts]
opsflow = "opsflow.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["opsflow"]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "opsflow.core.*"
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: marks tests as external contract tests",
]
