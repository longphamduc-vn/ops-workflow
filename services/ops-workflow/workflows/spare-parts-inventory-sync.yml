version: "1.0"
name: spare-parts-inventory-sync
description: Sync spare parts stock status and inventory balances from EMS platform

connectors:
  ems:
    type: nexacro
    base_url: http://localhost:9000
    format: xml
    verify_ssl: false
    follow_redirects: true
    allowed_services:
      - /emsspareparts/sp101/sp110Nav/RetStockStatusList.lgdn
    limits:
      max_concurrent: 3
      min_interval: 100ms

trigger:
  type: manual

inputs:
  organization_id:
    type: string
    default: "28753"
    description: Target EMS Organization Unit ID
  user_id:
    type: string
    default: "658359"
    description: User ID for EMS API execution context
  language:
    type: string
    default: "EN"
    description: Language preference

steps:
  - id: fetch_stock_status
    type: call
    with:
      connector: ems
      operation: /emsspareparts/sp101/sp110Nav/RetStockStatusList.lgdn
      params:
        _ems_userId: "${inputs.user_id}"
        _ems_organizationId: "${inputs.organization_id}"
        _ems_language: "${inputs.language}"
      in_datasets:
        ds_search:
          - organizationId: "${inputs.organization_id}"
            userId: "${inputs.user_id}"
            itemCond: "Y"
            optimizeFlag: "Y"
      out_datasets:
        - ds_result
    outputs:
      stock_list: "$.ds_result"

  - id: normalize_stock
    type: transform
    needs: [fetch_stock_status]
    with:
      engine: jmespath
      input: "${steps.fetch_stock_status.outputs.stock_list}"
      expression: |
        [].{
          item_code: itemName,
          description: itemDescription,
          inventory_item_id: inventoryItemId,
          onhand_qty: onhandQuantity,
          available_qty: availableQuantity,
          uom: uomCode,
          maker: maker,
          model: model
        }

  - id: save_to_db
    type: db_upsert
    needs: [normalize_stock]
    with:
      table: spare_parts_inventory
      key: [item_code]
      rows: "${steps.normalize_stock.outputs}"

publish:
  dataset: spare_parts_inventory
  source: "${steps.normalize_stock.outputs}"
  event: spare_parts.inventory.synced
