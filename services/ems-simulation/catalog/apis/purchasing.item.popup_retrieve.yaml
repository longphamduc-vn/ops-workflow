id: purchasing.item.popup_retrieve
name: Popup Retrieve Item
domain: purchasing
version: 1.0.0
enabled: true
endpoint:
  method: POST
  path: /emscom/popupNav/retrieveItem.lgdn
request:
  params:
  - _ems_userId
  - _ems_organizationId
  - _ems_language
  datasets:
  - name: ds_Search
    schema: purchasing.ds_Search.schema
execution:
  type: handler
  handler: popup.retrieve_item
  fixture_id: fixture.purchasing.item.popup_retrieve
response:
  params:
  - errorCode
  - errorMsg
  datasets:
  - name: ds_List
    schema: purchasing.ds_List.schema
