id: spare_parts.emergency_po.list
name: Emergency PO List
domain: spare_parts
version: 1.0.0
enabled: true
endpoint:
  method: POST
  path: /emsspareparts/sp105/sp180Nav/EmergencyPoList.lgdn
request:
  params:
  - _ems_userId
  - _ems_organizationId
  - _ems_language
  datasets:
  - name: ds_search
    schema: spare_parts.emergency_po.ds_search.schema
  - name: ds_ItemInfo
    schema: spare_parts.emergency_po.ds_ItemInfo.schema
  - name: ds_PoRvNo
    schema: spare_parts.emergency_po.ds_PoRvNo.schema
execution:
  type: handler
  handler: inventory.emergency_po_list
  fixture_id: fixture.spare_parts.emergency_po.list
response:
  params:
  - errorCode
  - errorMsg
  datasets:
  - name: ds_result
    schema: spare_parts.emergency_po.ds_result.schema
