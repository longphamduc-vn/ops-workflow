id: spare_parts.stock_status.search
name: Search Stock Status
domain: spare_parts
version: 1.0.0
enabled: true
endpoint:
  method: POST
  path: /emsspareparts/sp101/sp110Nav/RetStockStatusList.lgdn
request:
  params:
  - _ems_userId
  - _ems_organizationId
  - _ems_language
  datasets:
  - name: ds_search
    schema: spare_parts.ds_search.schema
  - name: ds_ItemInfo
    schema: spare_parts.ds_ItemInfo.schema
execution:
  type: handler
  handler: inventory.search_stock_status
  fixture_id: fixture.spare_parts.stock_status.search
response:
  params:
  - errorCode
  - errorMsg
  datasets:
  - name: ds_result
    schema: spare_parts.ds_result.schema
